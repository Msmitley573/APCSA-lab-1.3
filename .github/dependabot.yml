# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for more information:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://containers.dev/guide/dependabot

version: 2
updates:
 - package-ecosystem: "devcontainers"
   directory: "/"
   schedule:
     interval: weekly

 # There is deliberately no entry for .github/devcontainer-src/devcontainer.json, which is
 # the recipe the published image is built from: Dependabot's devcontainers ecosystem only
 # scans .devcontainer.json, .devcontainer/devcontainer.json and .devcontainer/*/
 # devcontainer.json, so it aborts on any other path. It is not needed there anyway -- that
 # file pins floating tags (features/java:1, java:3-17-bookworm) which already resolve to
 # the newest matching version every time the image is rebuilt on a push to main.
